coverage:
  status:
    project:
      default:
        # `auto` uses the base branch's coverage as the floor on every
        # PR. With the suite currently at 100% across both Unit and
        # Integration, this enforces "must stay at 100%".
        target: auto
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        # New code must be fully covered.
        target: 100%
        threshold: 0%
